<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MP3 → Bytebeat (conversor web)</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #4b5563;
      --line: #d1d5db;
      --accent: #2563eb;
      --accent-strong: #1d4ed8;
      --button: #f3f4f6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px 48px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
    }

    h1 {
      margin-top: 0;
      font-size: clamp(1.5rem, 2vw, 2rem);
    }

    p { color: var(--muted); }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input, button, textarea {
      font: inherit;
    }

    input[type="file"], input[type="number"], textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      background: #fff;
    }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: end;
      margin-top: 10px;
    }

    .field {
      flex: 1 1 220px;
      min-width: 180px;
    }

    button {
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--button);
      color: var(--text);
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    button.primary:hover:not(:disabled) {
      background: var(--accent-strong);
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .status {
      min-height: 1.5em;
      margin-top: 10px;
      color: var(--accent-strong);
      font-weight: 600;
    }

    textarea {
      min-height: 260px;
      resize: vertical;
      margin-top: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: #eef2ff;
      border-radius: 6px;
      padding: 2px 6px;
    }
  </style>
</head>
<body>
  <main>
    <h1>MP3 → Bytebeat (conversor web)</h1>
    <p>Escolha um arquivo MP3, configure a taxa de amostragem de saída e o comprimento máximo do array. O conversor roda no seu navegador e gera um arquivo JavaScript com <code>const data = [...]</code> para uso em bytebeat.</p>

    <label for="file">Arquivo MP3</label>
    <input id="file" type="file" accept="audio/*">

    <div class="row">
      <div class="field">
        <label for="samplerate">Taxa de amostragem (Hz)</label>
        <input id="samplerate" type="number" value="8000" min="100" step="100">
      </div>

      <div class="field">
        <label for="maxlen">Comprimento máximo do array</label>
        <input id="maxlen" type="number" value="65536" min="16" step="1">
      </div>

      <div class="field" style="flex: 0 0 auto;">
        <button id="convert" class="primary">Converter</button>
      </div>
    </div>

    <div class="status" id="status" aria-live="polite"></div>

    <div class="actions">
      <button id="play" disabled>Play Bytebeat</button>
      <button id="download" disabled>Baixar out.js</button>
    </div>

    <label for="jsout">Código JS gerado</label>
    <textarea id="jsout" readonly placeholder="O código gerado aparecerá aqui..."></textarea>
  </main>

  <script>
    const fileInput = document.getElementById('file');
    const convertBtn = document.getElementById('convert');
    const samplerateIn = document.getElementById('samplerate');
    const maxlenIn = document.getElementById('maxlen');
    const status = document.getElementById('status');
    const jsout = document.getElementById('jsout');
    const playBtn = document.getElementById('play');
    const downloadBtn = document.getElementById('download');

    let generated = null;

    function setStatus(message) {
      status.textContent = message;
    }

    function floatToU8(v) {
      const x = Math.min(255, Math.max(0, Math.round((v + 1) * 127.5)));
      return x;
    }

    function shrinkToMax(data, maxLen) {
      if (data.length <= maxLen) return data;
      const factor = Math.ceil(data.length / maxLen);
      setStatus(`Reduzindo comprimento: ${data.length} → fator de decimação ${factor}`);
      const out = new Uint8Array(Math.ceil(data.length / factor));
      let i = 0;
      for (let j = 0; j < data.length; j += factor) {
        out[i++] = data[j];
      }
      return out;
    }

    function getAudioContext() {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) {
        throw new Error('Seu navegador não suporta WebAudio.');
      }
      return new Ctx();
    }

    async function decodeAndResample(arrayBuffer, targetSampleRate) {
      const ac = getAudioContext();
      try {
        const decoded = await ac.decodeAudioData(arrayBuffer.slice(0));
        const numChannels = decoded.numberOfChannels;
        const length = Math.ceil(decoded.duration * targetSampleRate);

        if (numChannels === 0 || length <= 0) {
          return new Float32Array(0);
        }

        const offline = new OfflineAudioContext(1, length, targetSampleRate);
        const buffer = offline.createBuffer(1, decoded.length, decoded.sampleRate);
        const outBuf = buffer.getChannelData(0);

        for (let ch = 0; ch < numChannels; ch++) {
          const channelData = decoded.getChannelData(ch);
          for (let i = 0; i < channelData.length; i++) {
            outBuf[i] = (outBuf[i] || 0) + channelData[i] / numChannels;
          }
        }

        const src = offline.createBufferSource();
        src.buffer = buffer;
        src.connect(offline.destination);
        src.start(0);

        const rendered = await offline.startRendering();
        return rendered.getChannelData(0);
      } finally {
        await ac.close();
      }
    }

    function generateJS(sampleRate, u8arr, originalName) {
      const n = u8arr.length;
      const perLine = 20;
      const lines = [];
      for (let i = 0; i < n; i += perLine) {
        const slice = Array.from(u8arr.slice(i, i + perLine)).join(', ');
        lines.push('  ' + slice);
      }
      const arrText = '[\n' + lines.join(',\n') + '\n]';
      const header = `// Gerado pelo conversor web a partir de: ${originalName}\n// samplerate: ${sampleRate}, length: ${n}\n\n`;
      const body = `const SAMPLE_RATE = ${sampleRate};\nconst data = ${arrText};\n\nfunction bytebeat(t){\n  return data[t % data.length];\n}\n`;
      return header + body;
    }

    convertBtn.addEventListener('click', async () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) {
        alert('Escolha um arquivo MP3 primeiro.');
        return;
      }

      const sr = parseInt(samplerateIn.value, 10) || 8000;
      const maxlen = parseInt(maxlenIn.value, 10) || 65536;

      setStatus('Lendo arquivo...');

      try {
        const arrayBuffer = await file.arrayBuffer();
        setStatus(`Decodificando e resample para ${sr} Hz (pode demorar)...`);

        const floatData = await decodeAndResample(arrayBuffer, sr);
        setStatus('Convertendo amplitude para 0..255...');

        const u8 = new Uint8Array(floatData.length);
        for (let i = 0; i < floatData.length; i++) {
          u8[i] = floatToU8(floatData[i]);
        }

        const shrunk = shrinkToMax(u8, maxlen);
        const js = generateJS(sr, shrunk, file.name);
        jsout.value = js;
        generated = { sampleRate: sr, data: shrunk, filename: file.name };

        setStatus(`Pronto — tamanho final: ${shrunk.length} bytes`);
        playBtn.disabled = false;
        downloadBtn.disabled = false;
      } catch (err) {
        console.error(err);
        setStatus('Erro ao processar: ' + (err && err.message ? err.message : err));
      }
    });

    playBtn.addEventListener('click', async () => {
      if (!generated) return;
      setStatus('Gerando buffer de reprodução...');

      try {
        const ctx = getAudioContext();
        await ctx.resume();

        const len = generated.data.length;
        const buf = ctx.createBuffer(1, len, generated.sampleRate);
        const ch = buf.getChannelData(0);

        for (let i = 0; i < len; i++) {
          ch[i] = (generated.data[i] - 128) / 128;
        }

        const src = ctx.createBufferSource();
        src.buffer = buf;
        src.connect(ctx.destination);
        src.start();

        setStatus('Reproduzindo (atenção ao volume) — o áudio será tocado com a taxa de amostragem do bytebeat.');
      } catch (err) {
        console.error(err);
        setStatus('Erro ao reproduzir: ' + (err && err.message ? err.message : err));
      }
    });

    downloadBtn.addEventListener('click', () => {
      if (!generated) return;
      const js = generateJS(generated.sampleRate, generated.data, generated.filename);
      const blob = new Blob([js], { type: 'application/javascript;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'out.js';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      setStatus('Arquivo out.js baixado.');
    });
  </script>
</body>
</html>
